## VLC Skip Analogues
Ctrl+RIGHT seek 30
Ctrl+LEFT seek -30

## Playlist Navigation
n playlist-next
p playlist-prev

# Pressing 'ctrl-shift-d' will append the current file path to a log file for deletion
# Ctrl+Alt+d run "sh" "-c" "echo \"${path}\" >> ~/cull_list.txt"
Ctrl+Alt+x run "sh" "-c" "echo \"${path}\" >> ~/cull_list.txt"

# Pressing 'ctrl-shift-d' will append the current file path to a log file for deletion
Ctrl+Alt+c run "sh" "-c" "echo \"${path}\" >> ~/current_video.log"

## FZF Search Capability
ctrl+l script-binding fzf_playlist_menu


